name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Clean old build artifacts
    - name: Clean build
      run: dotnet clean --configuration Release || true

    # 3. Cache NuGet packages (fresh per run)
    - name: Cache NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          nuget-${{ runner.os }}

    # 4. Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 5. Validate file structure
    - name: Validate file structure
      run: |
        test -d Controllers || (echo "Missing Controllers folder" && exit 1)
        test -d Services || (echo "Missing Services folder" && exit 1)
        test -d Views || (echo "Missing Views folder" && exit 1)
        test -d Data || (echo "Missing Data folder" && exit 1)
        test -d Tests || (echo "Missing Tests folder" && exit 1)
        test -f Module.cs || (echo "Missing Module.cs" && exit 1)

    # 6. Restore dependencies
    - name: Restore dependencies
      run: dotnet restore VirtoCommerce.Payment.CCAvenue.csproj

    # 7. Build
    - name: Build
      run: dotnet build VirtoCommerce.Payment.CCAvenue.csproj --no-restore --configuration Release

    # 8. Run Unit Tests
    - name: Run tests
      run: dotnet test Modules/VirtoCommerce.CCAvenue/Tests --no-build --configuration Release /p:CollectCoverage=true /p:CoverletOutputFormat=lcov

    # 9. Upload Coverage Report
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: Modules/VirtoCommerce.CCAvenue/Tests/coverage.info

    # 10. Azure Login
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 11. Deploy ARM Template (azuredeploy.json)
    - name: Deploy Azure Resources
      uses: azure/arm-deploy@v1
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
        template: azuredeploy.json
        parameters: |
          siteName=virto-ccavenue-plan-site
          hostingPlanName=virto-ccavenue-plan
          sku=F1

    # 12. Deploy to Azure WebApp
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: virto-ccavenue-plan-site
        slot-name: production
        package: .
