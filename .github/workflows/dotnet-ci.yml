name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    # 3. Restore dependencies
    - name: Restore dependencies
      run: dotnet restore VirtoCommerce.Payment.CCAvenue.csproj

    # 4. Build
    - name: Build
      run: dotnet build VirtoCommerce.Payment.CCAvenue.csproj --no-restore --configuration Release

    # 5. Run Unit Tests
    - name: Run tests
      run: dotnet test Modules/VirtoCommerce.CCAvenue/Tests --no-build --configuration Release /p:CollectCoverage=true /p:CoverletOutputFormat=lcov

    # 6. Upload Coverage Report
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: Modules/VirtoCommerce.CCAvenue/Tests/coverage.info

    # 7. Azure Login
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 8. Deploy ARM Template (azuredeploy.json)
    - name: Deploy Azure Resources
      uses: azure/arm-deploy@v1
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
        template: azuredeploy.json
        parameters: |
          siteName=virto-ccavenue-plan-site
          hostingPlanName=virto-ccavenue-plan
          sku=F1

    # 9. Deploy to Azure WebApp
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: virto-ccavenue-plan-site
        slot-name: production
        package: .
